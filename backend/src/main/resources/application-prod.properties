# Perfil de PRODUCCION (SPRING_PROFILES_ACTIVE=prod en Render).
# Sin valores por defecto: si falta una variable de entorno, la aplicacion NO arranca (fail-fast).
# Asi nunca se usan por accidente la clave JWT ni las credenciales de desarrollo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ORIGINS}
# El admin inicial solo se crea si defines estas variables y la BD no tiene ningun ADMINISTRADOR
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
