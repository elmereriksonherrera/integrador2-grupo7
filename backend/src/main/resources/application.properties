spring.application.name=rentamax-backend
# Render define PORT; en local usa 8080
server.port=${PORT:8080}
server.forward-headers-strategy=framework
# No filtrar mensajes ni trazas internas al cliente
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ---------- Base de datos MySQL ----------
# Formato ${VARIABLE:valor_por_defecto}: en la nube se sobreescribe con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rentamax?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:rentamax}
spring.datasource.password=${DB_PASSWORD:rentamax123}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=900000

# La BD se crea con database/schema_v1.sql (fuente de verdad).
# "validate": Hibernate SOLO comprueba que las entidades coincidan con las tablas; no crea ni modifica nada.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# Clave en Base64 (minimo 256 bits). Esta es SOLO para desarrollo local; en la nube se usa JWT_SECRET.
app.jwt.secret=${JWT_SECRET:yh9DyXiCkAiC1hacOTB2QBGYrmUog7mljojNkDFvvO5K37JKAb3X9D8POrjuN1I8}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---------- Administrador inicial (solo si la BD no tiene ninguno) ----------
app.admin.email=${ADMIN_EMAIL:admin@rentamax.pe}
app.admin.password=${ADMIN_PASSWORD:Admin2026}

# ---------- CORS: dominios del front-end autorizados ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8080,https://integrador2-grupo7.vercel.app}
# Vistas previas de Vercel (integrador2-grupo7-xxxx.vercel.app)
app.cors.allowed-origin-patterns=${CORS_PATTERNS:https://integrador2-grupo7-*.vercel.app}
