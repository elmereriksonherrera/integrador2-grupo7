# OPCIONAL (solo si usas Docker): levanta MySQL 8 ya con el esquema y los datos de demostracion.
#   cd backend && docker compose up -d
# Si usas el MySQL instalado en tu laptop, NO necesitas este archivo.
services:
  mysql:
    image: mysql:8.0
    container_name: rentamax-mysql
    environment:
      MYSQL_DATABASE: rentamax
      MYSQL_USER: rentamax
      MYSQL_PASSWORD: rentamax123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - rentamax-data:/var/lib/mysql
      - ../database/schema_v1.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/seed_v1.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      retries: 20
volumes:
  rentamax-data:
